name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  mac:
    name: macOS (arm64 + x64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Package Apple Silicon (arm64)
        run: |
          node scripts/fetch-core.mjs --platform darwin --arch arm64 --force
          npx electron-builder --mac --arm64 --publish never

      - name: Package Intel (x64)
        run: |
          node scripts/fetch-core.mjs --platform darwin --arch amd64 --force
          npx electron-builder --mac --x64 --publish never

      - name: Smoke test (arm64 app starts and bundles the right core)
        run: |
          APP="release/mac-arm64/Anti VPN.app"
          codesign --verify --deep --strict "$APP"
          file "$APP/Contents/Resources/bin/sing-box" | grep arm64
          file "release/mac/Anti VPN.app/Contents/Resources/bin/sing-box" | grep x86_64
          "$APP/Contents/Resources/bin/sing-box" version
          "$APP/Contents/MacOS/Anti VPN" > app.log 2>&1 &
          PID=$!
          sleep 20
          if ! kill -0 $PID 2>/dev/null; then echo "App exited early"; cat app.log; exit 1; fi
          kill $PID || true
          cat app.log

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          VERSION="${TAG#v}"
          sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "Anti VPN $TAG" --notes-file notes.md --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber
